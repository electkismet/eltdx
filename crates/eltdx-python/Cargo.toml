[package]
name = "eltdx-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
eltdx = { path = "../eltdx", version = "=0.1.0", features = ["offline", "f10", "mac"] }
eltdx-protocol = { path = "../eltdx-protocol", version = "=3.3.5" }
eltdx-runtime = { path = "../eltdx-runtime", version = "=3.3.5" }
pyo3 = { workspace = true, features = ["abi3-py310", "extension-module"] }
thiserror.workspace = true

[lints]
workspace = true
