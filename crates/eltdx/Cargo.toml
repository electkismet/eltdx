[package]
name = "eltdx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "LICENSE"
repository.workspace = true
description = "Independent synchronous Rust SDK for TDX market data and local formats"
readme = "README.md"
keywords = ["tdx", "market-data", "finance", "protocol"]
categories = ["api-bindings", "network-programming"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "src/**", "examples/**", "tests/support/hq_server.rs", "tests/support/stress_log.rs"]

[features]
default = []
serde = ["dep:serde"]
offline = []
f10 = ["dep:serde_json", "dep:url", "dep:tokio", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio-rustls", "dep:rustls", "dep:rustls-native-certs", "dep:hickory-resolver", "dep:flate2", "dep:chrono"]
ex = ["dep:serde_json", "dep:tokio", "dep:flate2"]
mac = ["ex"]
full = ["serde", "offline", "f10", "ex", "mac"]

[dependencies]
bytes.workspace = true
crc32fast.workspace = true
zip.workspace = true
encoding_rs.workspace = true
eltdx-protocol = { path = "../eltdx-protocol", version = "=3.4.0-beta.1" }
eltdx-runtime = { path = "../eltdx-runtime", version = "=3.4.0-beta.1" }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
url = { version = "=2.5.8", optional = true }
tokio = { workspace = true, optional = true }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"], optional = true }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"], optional = true }
http-body-util = { version = "=0.1.5", optional = true }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"], optional = true }
rustls-native-certs = { version = "=0.8.2", optional = true }
hickory-resolver = { version = "=0.24.4", default-features = false, features = ["tokio-runtime", "system-config"], optional = true }
flate2 = { workspace = true, optional = true }
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "std"], optional = true }

[dev-dependencies]
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }
serde_json.workspace = true

[lints]
workspace = true

[[example]]
name = "financial_read"
required-features = ["offline"]

[[example]]
name = "financial_download"
required-features = ["offline"]

[[example]]
name = "ex_query"
required-features = ["ex"]

[[example]]
name = "measure_candidate"
required-features = ["offline"]
