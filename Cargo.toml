[workspace]
resolver = "2"
members = [
  "crates/eltdx-protocol",
  "crates/eltdx-runtime",
  "crates/eltdx-python",
]

[workspace.package]
version = "3.1.3"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/electkismet/eltdx"

[workspace.dependencies]
bytes = "=1.12.1"
encoding_rs = "=0.8.35"
flate2 = { version = "=1.1.2", default-features = false, features = ["rust_backend"] }
loom = "=0.7.2"
proptest = "=1.11.0"
pyo3 = "=0.29.2"
rand = "=0.9.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
socket2 = { version = "=0.6.5", features = ["all"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
