site_name: eltdx
site_url: https://electkismet.github.io/eltdx/
site_description: Rust 驱动 7709 行情与 7615 F10 的 Python 客户端
repo_url: https://github.com/electkismet/eltdx
repo_name: electkismet/eltdx
edit_uri: edit/main/docs/
copyright: 仅用于个人学习、协议研究和非商业研究
exclude_docs: /README.md

theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/chart-line
    repo: fontawesome/brands/github
  palette:
    scheme: default
    primary: red
    accent: amber
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\u200b\u3000\-\u3001\u3002\uff0c\uff0e\uff1f\uff01\uff1b()\[\]{},.:/="]+'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/interface-catalog.css
  - assets/return-samples.css

extra_javascript:
  - assets/interface-catalog-data.js
  - assets/interface-catalog.js

nav:
  - 接口目录: index.md
  - 使用指南:
      - 产品与能力: PRODUCT.md
      - v3.2.0 发布说明: releases/v3.2.0.md
      - v3.1.2 发布说明: releases/v3.1.2.md
      - v3.1.1 发布说明: releases/v3.1.1.md
      - v3.1.0 发布说明: releases/v3.1.0.md
      - v3.0.9 发布说明: releases/v3.0.9.md
      - v3.0.7 发布说明: releases/v3.0.7.md
      - v3.0.6 发布说明: releases/v3.0.6.md
      - v3.0.5 发布说明: releases/v3.0.5.md
      - v3.0.4 发布说明: releases/v3.0.4.md
      - v3.0.3 发布说明: releases/v3.0.3.md
      - v3.0.2 发布说明: releases/v3.0.2.md
      - v3.0.1 发布说明: releases/v3.0.1.md
      - v3.0.0 发布说明: releases/v3.0.0.md
      - 调用方法: METHOD_REFERENCE.md
      - API 参考: API_REFERENCE.md
      - 调用示例: EXAMPLES.md
      - 字段手册: FIELD_REFERENCE.md
  - 7709 行情:
      - 命令映射: COMMANDS_7709.md
      - 接口单页: methods/README.md
  - 7615 F10: F10_7615.md
  - Helpers: helpers/README.md
  - Helper 单页:
      - A 股常用封装总览: helpers/A股常用封装.md
      - 最新股票列表: helpers/最新股票列表.md
      - 最新 ST 列表: helpers/最新ST列表.md
      - 最新停牌列表: helpers/最新停牌列表.md
      - 每日股本（盘前）: helpers/每日股本.md
      - 每日涨跌停价: helpers/每日涨跌停价.md
      - 实时榜单: helpers/实时榜单.md
      - 买卖力道: helpers/买卖力道.md
      - 成交对比: helpers/成交对比.md
      - 连板天梯: helpers/连板天梯.md
      - 题材强度排行: helpers/题材强度排行.md
  - MCP: MCP.md
  - 跨语言网关: HTTP_GATEWAY.md
  - 工程参考:
      - 架构: ARCHITECTURE.md
      - 线程层扩容方案: THREADING_SCALE_PLAN.md
      - 架构决策记录: adr/README.md
      - 调试: DEBUG_GUIDE.md
      - 变更记录: CHANGELOG.md
      - 字段迁移到 2.0: FIELD_MIGRATION.md
      - API 迁移到 2.0: MIGRATION_FROM_OLD.md
      - 历史 v1.0 升级说明: UPDATE_FROM_0_5_1.md
      - 历史 v1.0 实现记录: ROADMAP.md
      - GitHub Pages: GITHUB_PAGES.md

not_in_nav: |
  methods/*.md
  helpers/*.md
  releases/*.md
