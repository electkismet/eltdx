site_name: eltdx
site_url: https://electkismet.github.io/eltdx/
site_description: Rust 驱动 7709 行情与 7615 F10 的 Python 客户端
repo_url: https://github.com/electkismet/eltdx
repo_name: electkismet/eltdx
edit_uri: edit/main/docs/
copyright: 仅供个人学习、数据接口与格式研究及非商业用途使用；完整条款见 LICENSE
exclude_docs: /README.md

theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/chart-line
    repo: fontawesome/brands/github
  palette:
    scheme: default
    primary: red
    accent: amber
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\u200b\u3000\-\u3001\u3002\uff0c\uff0e\uff1f\uff01\uff1b()\[\]{},.:/="]+'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/interface-catalog.css
  - assets/return-samples.css

extra_javascript:
  - assets/interface-catalog-data.js
  - assets/interface-catalog.js

nav:
  - 接口目录: index.md
  - 使用指南:
      - 产品与能力: PRODUCT.md
      - v3.3.5 发布说明: releases/v3.3.5.md
      - v3.3.3 发布说明: releases/v3.3.3.md
      - v3.3.2 发布说明: releases/v3.3.2.md
      - v3.3.1 发布说明: releases/v3.3.1.md
      - v3.3.0 发布说明: releases/v3.3.0.md
      - v3.2.3 发布说明: releases/v3.2.3.md
      - v3.2.2 发布说明: releases/v3.2.2.md
      - v3.2.1 发布说明: releases/v3.2.1.md
      - v3.2.0 发布说明: releases/v3.2.0.md
      - v3.1.2 发布说明: releases/v3.1.2.md
      - v3.1.1 发布说明: releases/v3.1.1.md
      - v3.1.0 发布说明: releases/v3.1.0.md
      - v3.0.9 发布说明: releases/v3.0.9.md
