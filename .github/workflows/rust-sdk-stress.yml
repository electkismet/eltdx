name: Native Rust SDK release stress

on:
  workflow_dispatch:
    inputs:
      implementation-complete:
        description: All T01-T30 implementation sources are complete and ordinary verification passed
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-stress:
    if: inputs.implementation-complete
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install psutil==7.2.2
      - run: rustup toolchain install 1.89.0 --profile minimal
      - name: Compile first, then observe only native ignored test processes
        run: >-
          python scripts/verification/rust_sdk_stress.py run
          --implementation-complete --output artifacts/native-stress
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-sdk-stress-${{ matrix.os }}
          path: |
            artifacts/native-stress/stress-run.json
            artifacts/native-stress/source-inputs.json
            artifacts/native-stress/*.log
            artifacts/native-stress/*-resources.ndjson
            artifacts/native-stress/events/*.ndjson
          if-no-files-found: error

  aggregate:
    needs: native-stress
    if: always() && inputs.implementation-complete
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          pattern: native-sdk-stress-*
          path: artifacts/stress-inputs
      - name: Re-read all raw events and resources; require both platforms
        run: >-
          python scripts/verification/rust_sdk_stress.py aggregate
          --implementation-complete --candidate '${{ github.sha }}'
          --inputs artifacts/stress-inputs --output artifacts/native-stress-aggregate.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-sdk-stress-aggregate
          path: |
            artifacts/native-stress-aggregate.json
            artifacts/stress-inputs/**/stress-recomputed.json
          if-no-files-found: error
