name: Independent Rust SDK candidate

on:
  workflow_dispatch:
    inputs:
      implementation-complete:
        description: All T01-T30 implementation sources are complete
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  documentation:
    if: inputs.implementation-complete
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install the existing documentation builder without building the Python product
        run: python -m pip install 'mkdocs-material==9.7.6'
      - name: Verify metadata, full package documentation mirror, strict site, and local links
        shell: bash
        run: |
          mkdir -p artifacts/sdk-docs
          set -o pipefail
          python scripts/verification/check_release_metadata.py 2>&1 | tee artifacts/sdk-docs/metadata.log
          python -m mkdocs build --strict 2>&1 | tee artifacts/sdk-docs/mkdocs.log
          python scripts/verification/check_pages_links.py site 2>&1 | tee artifacts/sdk-docs/links.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-sdk-documentation
          path: artifacts/sdk-docs
          if-no-files-found: error

  platform:
    if: inputs.implementation-complete
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        rust: ['1.89.0', stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install selected toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
      - name: Run platform contracts and retain every command result
        shell: pwsh
        run: ./scripts/verification/rust_sdk_matrix.ps1 -ImplementationComplete -Mode platform -Toolchain '${{ matrix.rust }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-sdk-${{ matrix.os }}-${{ matrix.rust }}
          path: artifacts/rust-sdk
          if-no-files-found: error

  feature-subsets:
    if: inputs.implementation-complete
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.89.0', stable]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: All 32 explicit subsets plus default and full alias
        shell: pwsh
        run: ./scripts/verification/rust_sdk_matrix.ps1 -ImplementationComplete -Mode features -Toolchain '${{ matrix.rust }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-sdk-features-${{ matrix.rust }}
          path: artifacts/rust-sdk
          if-no-files-found: error

  no-python:
    if: inputs.implementation-complete
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Copy and consume outside checkout in a Rust-only container
        shell: bash
        run: |
          mkdir -p artifacts/no-python
          docker run --rm -e ELTDX_IMPLEMENTATION_COMPLETE=yes \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$GITHUB_WORKSPACE/artifacts/no-python:/evidence" \
            rust:1.89.0-slim-bookworm bash -c \
            'set +e; bash /source/scripts/verification/rust_sdk_no_python.sh /source /tmp/consumer-run; result=$?; if [ -d /tmp/consumer-run/evidence ]; then cp -R /tmp/consumer-run/evidence/. /evidence/; fi; exit "$result"'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-sdk-no-python
          path: artifacts/no-python
          if-no-files-found: error

  loom:
    if: inputs.implementation-complete
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 test -p eltdx-runtime --features loom --locked

  archive-consumer:
    if: inputs.implementation-complete
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.89.0 --profile minimal
      - name: Package and consume only unpacked candidate archives
        run: >-
          python scripts/verification/rust_sdk_packages.py archives
          --implementation-complete --output artifacts/crate-candidate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-sdk-packages-${{ matrix.os }}
          path: |
            artifacts/crate-candidate/packages.json
            artifacts/crate-candidate/*.log
            artifacts/crate-candidate/target/package/*.crate
            artifacts/crate-candidate/consumer/Cargo.toml
            artifacts/crate-candidate/consumer/Cargo.lock
          if-no-files-found: error
