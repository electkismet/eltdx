name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-dist:
    uses: ./.github/workflows/native-wheels.yml

  verify-release:
    name: Verify release candidate metadata
    needs: native-dist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Verify tag, version, candidate, and artifact identity
        run: >-
          python scripts/verification/check_release_metadata.py
          --artifact-dir dist/packages
          --ref "${{ github.ref }}"
          --sha "${{ github.sha }}"
      - name: Upload dry-run evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-verification
          path: |
            dist/artifacts.json
            dist/SHA256SUMS
          if-no-files-found: error

  testpypi:
    name: Upload exact artifacts to TestPyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [native-dist, verify-release]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/eltdx
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Upload to TestPyPI after environment approval
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/packages/
          skip-existing: false

  testpypi-smoke:
    name: Install exact version from TestPyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify-release, testpypi]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Verify TestPyPI installation and entry points
        run: >-
          python scripts/verification/verify_testpypi.py
          --tag "${{ github.ref_name }}"
          --candidate "${{ github.sha }}"
          --artifact-manifest dist/artifacts.json

  pypi:
    name: Upload exact artifacts to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [native-dist, verify-release, testpypi-smoke]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/eltdx
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Upload to PyPI after independent environment approval
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/packages/
          skip-existing: false

  release:
    name: Create GitHub Release from exact artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [native-dist, verify-release, pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Prepare release notes
        run: >-
          python scripts/release/prepare_release_notes.py
          --tag "${{ github.ref_name }}"
          --output RELEASE_NOTES.md
      - name: Create release without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/packages/* dist/SHA256SUMS
          --verify-tag
          --title "${{ github.ref_name }}"
          --notes-file RELEASE_NOTES.md
